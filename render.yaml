services:
  - type: web
    name: fernanda-azevedo
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/public/settings
    envVars:
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_HOST
        fromDatabase:
          name: fernanda-azevedo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: fernanda-azevedo-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: fernanda-azevedo-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: fernanda-azevedo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fernanda-azevedo-db
          property: password
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: WEBRTC_TURN_URL
        sync: false
      - key: WEBRTC_TURN_USERNAME
        sync: false
      - key: WEBRTC_TURN_CREDENTIAL
        sync: false

databases:
  - name: fernanda-azevedo-db
    plan: free
    databaseName: fernanda_azevedo
    user: fernanda_azevedo_app
