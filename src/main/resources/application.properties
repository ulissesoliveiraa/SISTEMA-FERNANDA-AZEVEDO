spring.application.name=fernanda-azevedo
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/fernanda-azevedo;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
webrtc.turn.url=${WEBRTC_TURN_URL:}
webrtc.turn.username=${WEBRTC_TURN_USERNAME:}
webrtc.turn.credential=${WEBRTC_TURN_CREDENTIAL:}
storage.private.root=${PRIVATE_STORAGE_ROOT:./private-storage}
security.clamav.host=${CLAMAV_HOST:}
security.clamav.port=${CLAMAV_PORT:3310}
security.clamav.timeout-ms=${CLAMAV_TIMEOUT_MS:10000}
