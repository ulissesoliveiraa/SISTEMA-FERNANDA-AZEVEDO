spring.application.name=fernanda-azevedo
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/fernanda-azevedo;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.name=FASESSION
server.servlet.session.timeout=30m
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
webrtc.turn.url=${WEBRTC_TURN_URL:}
webrtc.turn.username=${WEBRTC_TURN_USERNAME:}
webrtc.turn.credential=${WEBRTC_TURN_CREDENTIAL:}
storage.private.root=${PRIVATE_STORAGE_ROOT:./private-storage}
storage.provider=${STORAGE_PROVIDER:local}
storage.staging.root=${STORAGE_STAGING_ROOT:${java.io.tmpdir}/fernanda-azevedo-scan}
storage.s3.bucket=${STORAGE_S3_BUCKET:}
storage.s3.region=${STORAGE_S3_REGION:us-east-1}
storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:}
storage.s3.prefix=${STORAGE_S3_PREFIX:clinical-attachments/}
security.clamav.host=${CLAMAV_HOST:}
security.clamav.port=${CLAMAV_PORT:3310}
security.clamav.timeout-ms=${CLAMAV_TIMEOUT_MS:10000}
app.demo.expose-reset-token=${DEMO_EXPOSE_RESET_TOKEN:false}
